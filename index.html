<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Ace - Nút Tròn Xoay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:#090a10;color:#fff;font-family:Arial,sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding-bottom:10px}
.top-banner{width:100%;background:linear-gradient(180deg,#1e092b,#090a10);padding:10px 0;border-bottom:2px solid #e2b34a}
.logo{font-size:26px;font-weight:900;font-style:italic;background:linear-gradient(180deg,#fff7a1,#f5af19,#e17000);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mult-bar{display:flex;justify-content:center;gap:8px;margin:8px 0}
.mult-btn{background:#191c2b;border:1px solid #3c4363;color:#7b88b3;padding:4px 12px;border-radius:12px;font-weight:bold;font-size:13px}
.mult-btn.active{background:linear-gradient(180deg,#ffe066,#f5af19);color:#000;border-color:#fff;box-shadow:0 0 8px #f5af19}
.game-frame{width:95%;max-width:390px;background:#121420;border:2px solid #d4a338;border-radius:12px;padding:8px;box-shadow:inset 0 0 15px #000;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

@keyframes slideDown {
    0% { transform: translateY(-60px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

.card{
    background:linear-gradient(145deg,#1e2235,#11131f);
    border:1px solid #383f5d;
    border-radius:6px;
    height:72px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    animation: slideDown 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

.symbol{font-size:26px;font-weight:bold}
.sub{font-size:9px;color:#8a98c2;font-weight:bold}
.card.win{border:2px solid #00ffcc;box-shadow:0 0 10px #00ffcc}
.status{font-size:15px;font-weight:bold;color:#ffd700;margin:6px 0}

.bottom-panel{width:100%;max-width:400px;background:#0f111a;border-top:1px solid #2a2f45;padding:10px 15px;display:flex;flex-direction:column;align-items:center;}
.data-row{display:flex;justify-content:space-between;width:100%;margin-bottom:8px}
.data-card{background:#171a26;border:1px solid #2a2f45;border-radius:8px;padding:6px 10px;width:48%}
.title{font-size:10px;color:#6c7a9c}
.val{font-size:17px;font-weight:bold;color:#00ffcc}

/* Nút quay hình tròn và hiệu ứng xoay */
.spin-btn{
    width: 82px;
    height: 82px;
    border-radius: 50%;
    font-size: 15px;
    font-weight: 900;
    border: 3px solid #ffdf40;
    background: linear-gradient(135deg, #fff275, #f5af19, #c75c00);
    color: #000;
    box-shadow: 0 0 15px rgba(245, 175, 25, 0.6);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.1s;
}
.spin-btn:active{transform:scale(0.9);}
.spin-btn:disabled{background:#444;color:#777;border-color:#666;box-shadow:none;cursor:not-allowed;}

@keyframes rotateBtn {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.spin-btn.spinning {
    animation: rotateBtn 0.6s linear infinite;
}
</style>
</head>
<body>
<div class="top-banner">
<div class="logo">SUPER ACE</div>
<div class="mult-bar">
<div id="m1" class="mult-btn active">x1</div>
<div id="m2" class="mult-btn">x2</div>
<div id="m3" class="mult-btn">x3</div>
<div id="m5" class="mult-btn">x5</div>
</div>
</div>
<div class="game-frame">
<div class="grid" id="grid"></div>
</div>
<div class="status" id="status">NHẤN QUAY ĐỂ BẮT ĐẦU</div>
<div class="bottom-panel">
<div class="data-row">
<div class="data-card"><div class="title">SỐ DƯ</div><div class="val" id="balance">10,000</div></div>
<div class="data-card"><div class="title">THẮNG</div><div class="val" id="win" style="color:#ffe066">0</div></div>
</div>
<button class="spin-btn" id="spinBtn" onclick="spin()">QUAY</button>
</div>
<script>
const ITEMS=[
{sym:'A♠',name:'ÁT BÍCH',color:'#00d2ff',val:50},
{sym:'A♥',name:'ÁT CƠ',color:'#ff4d4d',val:50},
{sym:'K♦',name:'GIÀ RÔ',color:'#ffcc00',val:40},
{sym:'K♣',name:'GIÀ NHÉP',color:'#ffcc00',val:40},
{sym:'Q♠',name:'ĐẦM BÍCH',color:'#ff4081',val:30},
{sym:'Q♥',name:'ĐẦM CƠ',color:'#ff4081',val:30},
{sym:'J♦',name:'BỒI RÔ',color:'#b388ff',val:20},
{sym:'J♣',name:'BỒI NHÉP',color:'#b388ff',val:20},
{sym:'10♥',name:'10 CƠ',color:'#ff7777',val:10},
{sym:'🌟',name:'WILD',color:'#ff9100',val:100}
];
let balance=10000,isSpinning=false,grid=document.getElementById('grid');
function init(){
grid.innerHTML='';
for(let i=0;i<16;i++)grid.appendChild(createCard(ITEMS[Math.floor(Math.random()*ITEMS.length)], i));
}
function createCard(item, index){
let d=document.createElement('div');
d.className='card';
d.style.animationDelay = (index * 0.02) + 's';
d.innerHTML=`<div class="symbol" style="color:${item.color}">${item.sym}</div><div class="sub">${item.name}</div>`;
return d;
}
function spin(){
if(isSpinning||balance<100)return;
balance-=100;
document.getElementById('balance').innerText=balance.toLocaleString();
document.getElementById('win').innerText='0';
document.getElementById('status').innerText='ĐANG QUAY...';
let btn = document.getElementById('spinBtn');
btn.disabled=true;
btn.classList.add('spinning');
isSpinning=true;
let c=0,t=setInterval(()=>{
grid.innerHTML='';
for(let i=0;i<16;i++)grid.appendChild(createCard(ITEMS[Math.floor(Math.random()*ITEMS.length)], i));
c++;
if(c>15){clearInterval(t);finish();}
},60);
}
function finish(){
isSpinning=false;
let btn = document.getElementById('spinBtn');
btn.disabled=false;
btn.classList.remove('spinning');
if(Math.random()>0.5){
let w=Math.floor(Math.random()*5+1)*250;
balance+=w;
document.getElementById('balance').innerText=balance.toLocaleString();
document.getElementById('win').innerText=w.toLocaleString();
document.getElementById('status').innerText=`🎉 BIG WIN +${w}!`;
document.querySelectorAll('.mult-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('m3').classList.add('active');
}else{
document.getElementById('status').innerText='CHÚC MAY MẮN LẦN SAU!';
document.querySelectorAll('.mult-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('m1').classList.add('active');
}
}
init();
</script>
</body>
</html>

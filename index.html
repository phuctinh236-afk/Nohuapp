<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Ace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:#090a10;color:#fff;font-family:Arial,sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding-bottom:10px}
.top-banner{width:100%;background:linear-gradient(180deg,#1e092b,#090a10);padding:10px 0;border-bottom:2px solid #e2b34a}
.logo{font-size:26px;font-weight:900;font-style:italic;background:linear-gradient(180deg,#fff7a1,#f5af19,#e17000);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mult-bar{display:flex;justify-content:center;gap:8px;margin:8px 0}
.mult-btn{background:#191c2b;border:1px solid #3c4363;color:#7b88b3;padding:4px 12px;border-radius:12px;font-weight:bold;font-size:13px}
.mult-btn.active{background:linear-gradient(180deg,#ffe066,#f5af19);color:#000;border-color:#fff;box-shadow:0 0 8px #f5af19}
.game-frame{width:95%;max-width:390px;background:#121420;border:2px solid #d4a338;border-radius:12px;padding:8px;box-shadow:inset 0 0 15px #000}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{background:linear-gradient(145deg,#1e2235,#11131f);border:1px solid #383f5d;border-radius:6px;height:72px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.symbol{font-size:30px;font-weight:bold}
.sub{font-size:10px;color:#8a98c2;font-weight:bold}
.card.win{border:2px solid #00ffcc;box-shadow:0 0 10px #00ffcc}
.status{font-size:15px;font-weight:bold;color:#ffd700;margin:6px 0}
.bottom-panel{width:100%;max-width:400px;background:#0f111a;border-top:1px solid #2a2f45;padding:10px 15px}
.data-row{display:flex;justify-content:space-between;margin-bottom:8px}
.data-card{background:#171a26;border:1px solid #2a2f45;border-radius:8px;padding:6px 10px;width:48%}
.title{font-size:10px;color:#6c7a9c}
.val{font-size:17px;font-weight:bold;color:#00ffcc}
.spin-btn{width:100%;padding:14px;font-size:20px;font-weight:900;border-radius:25px;border:none;background:linear-gradient(180deg,#fff275,#f5af19,#e17000);color:#000;box-shadow:0 4px 0 #9e4b00;cursor:pointer}
.spin-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9e4b00}
.spin-btn:disabled{background:#444;color:#777;box-shadow:none}
</style>
</head>
<body>
<div class="top-banner">
<div class="logo">SUPER ACE</div>
<div class="mult-bar">
<div id="m1" class="mult-btn active">x1</div>
<div id="m2" class="mult-btn">x2</div>
<div id="m3" class="mult-btn">x3</div>
<div id="m5" class="mult-btn">x5</div>
</div>
</div>
<div class="game-frame">
<div class="grid" id="grid"></div>
</div>
<div class="status" id="status">NHẤN QUAY ĐỂ BẮT ĐẦU</div>
<div class="bottom-panel">
<div class="data-row">
<div class="data-card"><div class="title">SỐ DƯ</div><div class="val" id="balance">10,000</div></div>
<div class="data-card"><div class="title">THẮNG</div><div class="val" id="win" style="color:#ffe066">0</div></div>
</div>
<button class="spin-btn" id="spinBtn" onclick="spin()">QUAY (100)</button>
</div>
<script>
const ITEMS=[
{sym:'♠️',name:'ACE',color:'#00d2ff',val:50},
{sym:'👑',name:'KING',color:'#ffcc00',val:30},
{sym:'👸',name:'QUEEN',color:'#ff4081',val:20},
{sym:'🃏',name:'JACK',color:'#b388ff',val:10},
{sym:'🌟',name:'WILD',color:'#ff9100',val:100}
];
let balance=10000,isSpinning=false,grid=document.getElementById('grid');
function init(){
grid.innerHTML='';
for(let i=0;i<16;i++)grid.appendChild(createCard(ITEMS[Math.floor(Math.random()*4)]));
}
function createCard(item){
let d=document.createElement('div');
d.className='card';
d.innerHTML=`<div class="symbol" style="color:${item.color}">${item.sym}</div><div class="sub">${item.name}</div>`;
return d;
}
function spin(){
if(isSpinning||balance<100)return;
balance-=100;
document.getElementById('balance').innerText=balance.toLocaleString();
document.getElementById('win').innerText='0';
document.getElementById('status').innerText='ĐANG QUAY...';
document.getElementById('spinBtn').disabled=true;
isSpinning=true;
let c=0,t=setInterval(()=>{
grid.innerHTML='';
for(let i=0;i<16;i++)grid.appendChild(createCard(ITEMS[Math.floor(Math.random()*ITEMS.length)]));
c++;
if(c>15){clearInterval(t);finish();}
},60);
}
function finish(){
isSpinning=false;
document.getElementById('spinBtn').disabled=false;
if(Math.random()>0.5){
let w=Math.floor(Math.random()*5+1)*200;
balance+=w;
document.getElementById('balance').innerText=balance.toLocaleString();
document.getElementById('win').innerText=w.toLocaleString();
document.getElementById('status').innerText=`🎉 BIG WIN +${w}!`;
document.querySelectorAll('.mult-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('m3').classList.add('active');
}else{
document.getElementById('status').innerText='CHÚC MAY MẮN LẦN SAU!';
document.querySelectorAll('.mult-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('m1').classList.add('active');
}
}
init();
</script>
</body>
</html>

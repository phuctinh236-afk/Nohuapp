<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Xỉu Giải Trí</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .balance { font-size: 20px; color: #facc15; margin-bottom: 20px; }
        .dice-box { font-size: 40px; margin: 20px; background: #1e293b; padding: 15px; border-radius: 10px; }
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        button { padding: 12px 25px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-tai { background: #ef4444; color: white; }
        .btn-xiu { background: #3b82f6; color: white; }
        input { padding: 10px; font-size: 16px; width: 150px; text-align: center; border-radius: 5px; border: none; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>🎲 TÀI XỈU MINI APP 🎲</h1>
    <div class="balance">Số dư: <span id="coins">1000</span> Xu</div>

    <div>
        <input type="number" id="betAmount" value="100" min="10" placeholder="Số tiền cược">
    </div>

    <div class="dice-box" id="diceResult">🎲 🎲 🎲</div>
    <h3 id="resultText">Hãy chọn cửa đặt cược!</h3>

    <div class="btn-group">
        <button class="btn-tai" onclick="playGame('TAI')">TÀI (11-17)</button>
        <button class="btn-xiu" onclick="playGame('XIU')">XỈU (4-10)</button>
    </div>

    <script>
        let balance = 1000;

        function playGame(choice) {
            let bet = parseInt(document.getElementById('betAmount').value);
            if (isNaN(bet) || bet <= 0) {
                alert("Vui lòng nhập số tiền cược hợp lệ!");
                return;
            }
            if (bet > balance) {
                alert("Bạn không đủ xu để cược!");
                return;
            }

            // Quay ngẫu nhiên 3 con xúc xắc từ 1 đến 6
            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = Math.floor(Math.random() * 6) + 1;
            let d3 = Math.floor(Math.random() * 6) + 1;
            let total = d1 + d2 + d3;

            let outcome = (total >= 11 && total <= 17) ? 'TAI' : 'XIU';
            
            document.getElementById('diceResult').innerText = `🎲 ${d1} - ${d2} - ${d3} (Tổng: ${total})`;

            if (choice === outcome) {
                balance += bet;
                document.getElementById('resultText').innerText = `🎉 Chúc mừng! Bạn đã thắng ${bet} Xu.`;
                document.getElementById('resultText').style.color = '#22c55e';
            } else {
                balance -= bet;
                document.getElementById('resultText').innerText = `😢 Rất tiếc! Bạn đã thua ${bet} Xu.`;
                document.getElementById('resultText').style.color = '#ef4444';
            }

            document.getElementById('coins').innerText = balance;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #090a10;
            color: #fff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
        }

        .top-banner {
            width: 100%;
            background: linear-gradient(180deg, #1e092b, #090a10);
            padding: 10px 0;
            border-bottom: 2px solid #e2b34a;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(180deg, #fff7a1, #f5af19, #e17000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(245, 175, 25, 0.6);
        }

        .mult-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .mult-btn {
            background: #191c2b;
            border: 1px solid #3c4363;
            color: #7b88b3;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .mult-btn.active {
            background: linear-gradient(180deg, #ffe066, #f5af19);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px #f5af19;
        }
                .game-frame {
            width: 95%;
            max-width: 390px;
            background: #121420;
            border: 2px solid #d4a338;
            border-radius: 12px;
            padding: 8px;
            box-shadow: inset 0 0 15px #000, 0 0 15px rgba(212, 163, 56, 0.3);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .card {
            background: linear-gradient(145deg, #1e2235, #11131f);
            border: 1px solid #383f5d;
            border-radius: 6px;
            height: 75px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .card .symbol { font-size: 32px; font-weight: bold; }
        .card .sub { font-size: 10px; color: #8a98c2; font-weight: bold; }
        .card.win {
            border: 2px solid #00ffcc;
            box-shadow: 0 0 12px #00ffcc;
            animation: flash 0.4s infinite alternate;
        }
        @keyframes flash {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        .status { font-size: 16px; font-weight: bold; color: #ffd700; min-height: 24px; margin: 8px 0; }

        .bottom-panel {
            width: 100%;
            max-width: 400px;
            background: #0f111a;
            border-top: 1px solid #2a2f45;
            padding: 10px 15px;
        }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .data-card {
            background: #171a26;
            border: 1px solid #2a2f45;
            border-radius: 8px;
            padding: 6px 12px;
            width: 48%;
        }
        .data-card .title { font-size: 11px; color: #6c7a9c; }
        .data-card .val { font-size: 18px; font-weight: bold; color: #00ffcc; }

        .spin-btn {
            width: 100%;
            padding: 14px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 25px;
            border: none;
            background: linear-gradient(180deg, #fff275, #f5af19, #e17000);
            color: #000;
            box-shadow: 0 5px 0 #9e4b00;
            cursor: pointer;
        }
        .spin-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #9e4b00; }
        .spin-btn:disabled { background: #444; color: #777; box-shadow: none; }
    </style>
</head>
<body>

    <div class="top-banner">
        <div class="logo">SUPER ACE</div>
        <div class="mult-bar">
            <div id="m1" class="mult-btn active">x1</div>
            <div id="m2" class="mult-btn">x2</div>
            <div id="m3" class="mult-btn">x3</div>
            <div id="m5" class="mult-btn">x5</div>
        </div>
    </div>

    <div class="game-frame">
        <div class="grid" id="grid"></div>
    </div>

    <div class="status" id="status">NHẤN QUAY ĐỂ BẮT ĐẦU</div>

    <div class="bottom-panel">
        <div class="data-row">
            <div class="data-card">
                <div class="title">SỐ DƯ</div>
                <div class="val" id="balance">10,000</div>
            </div>
            <div class="data-card">
                <div class="title">THẮNG</div>
                <div class="val" id="win" style="color: #ffe066;">0</div>
            </div>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spin()">QUAY (100)</button>
    </div>
        <script>
        const ITEMS = [
            { sym: '♠️', name: 'ACE', color: '#00d2ff', val: 50 },
            { sym: '👑', name: 'KING', color: '#ffcc00', val: 30 },
            { sym: '👸', name: 'QUEEN', color: '#ff4081', val: 20 },
            { sym: '🃏', name: 'JACK', color: '#b388ff', val: 10 },
            { sym: '🃏', name: 'WILD', color: '#ff9100', val: 100 }
        ];

        let balance = 10000;
        let isSpinning = false;
        const grid = document.getElementById('grid');

        function init() {
            grid.innerHTML = '';
            for(let i=0; i<16; i++) {
                const item = ITEMS[Math.floor(Math.random() * 4)];
                grid.appendChild(createCard(item));
            }
        }

        function createCard(item) {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<div class="symbol" style="color:${item.color}">${item.sym}</div><div class="sub">${item.name}</div>`;
            return div;
        }

        function spin() {
            if(isSpinning || balance < 100) return;
            balance -= 100;
            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('win').innerText = '0';
            document.getElementById('status').innerText = 'ĐANG QUAY...';
            document.getElementById('spinBtn').disabled = true;
            isSpinning = true;

            let count = 0;
            const timer = setInterval(() => {
                grid.innerHTML = '';
                for(let i=0; i<16; i++) {
                    const rand = ITEMS[Math.floor(Math.random() * ITEMS.length)];
                    grid.appendChild(createCard(rand));
                }
                count++;
                if(count > 15) {
                    clearInterval(timer);
                    finishSpin();
                }
            }, 70);
        }

        function finishSpin() {
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
            
            const isWin = Math.random() > 0.5;
            if(isWin) {
                const winVal = Math.floor(Math.random() * 5 + 1) * 200;
                balance += winVal;
                document.getElementById('balance').innerText = balance.toLocaleString();
                document.getElementById('win').innerText = winVal.toLocaleString();
                document.getElementById('status').innerText = `🎉 BIG WIN +${winVal}!`;
                
                document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('m3').classList.add('active');
            } else {
                document.getElementById('status').innerText = 'CHÚC MAY MẮN LẦN SAU!';
                document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('m1').classList.add('active');
            }
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Ace - Chọn Mức Cược</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:#090a10;color:#fff;font-family:Arial,sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding-bottom:10px}
.top-banner{width:100%;background:linear-gradient(180deg,#1e092b,#090a10);padding:10px 0;border-bottom:2px solid #e2b34a}
.logo{font-size:26px;font-weight:900;font-style:italic;background:linear-gradient(180deg,#fff7a1,#f5af19,#e17000);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mult-bar{display:flex;justify-content:center;gap:8px;margin:8px 0}
.mult-btn{background:#191c2b;border:1px solid #3c4363;color:#7b88b3;padding:4px 12px;border-radius:12px;font-weight:bold;font-size:13px}
.mult-btn.active{background:linear-gradient(180deg,#ffe066,#f5af19);color:#000;border-color:#fff;box-shadow:0 0 8px #f5af19}

.game-frame{width:95%;max-width:390px;background:#121420;border:2px solid #d4a338;border-radius:12px;padding:8px;box-shadow:inset 0 0 15px #000;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

@keyframes slideDown {
    0% { transform: translateY(-60px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

.card{
    background: linear-gradient(135deg, #ffffff, #f0f0f0);
    border: 2px solid #b8973b;
    border-radius: 6px;
    height: 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    padding: 4px 6px;
    position: relative;
    animation: slideDown 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

.card-top { font-size: 11px; font-weight: bold; line-height: 1; }
.card-center { font-size: 24px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.card-sub { font-size: 8px; font-weight: bold; align-self: flex-end; color: #555; }

.card.wild { background: linear-gradient(135deg, #fff3cd, #ffeeba); border-color: #ff9100; }
.card.win { border: 2px solid #00ffcc; box-shadow: 0 0 10px #00ffcc; }

.status{font-size:14px;font-weight:bold;color:#ffd700;margin:4px 0}

.bottom-panel{width:100%;max-width:400px;background:#0f111a;border-top:1px solid #2a2f45;padding:8px 12px;display:flex;flex-direction:column;align-items:center;}

/* Thanh chọn mức cược cuộn ngang */
.bet-container { width: 100%; margin-bottom: 6px; text-align: left; }
.bet-label { font-size: 10px; color: #8a98c2; font-weight: bold; margin-bottom: 3px; display: block; }
.bet-bar {
    display: flex;
    overflow-x: auto;
    gap: 5px;
    width: 100%;
    padding-bottom: 4px;
    scrollbar-width: none;
}
.bet-bar::-webkit-scrollbar { display: none; }
.bet-btn {
    background: #171a26;
    border: 1px solid #3c4363;
    color: #93a2cb;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
}
.bet-btn.active {
    background: linear-gradient(135deg, #ffdf40, #f5af19);
    color: #000;
    border-color: #fff;
    box-shadow: 0 0 6px #f5af19;
}

.data-row{display:flex;justify-content:space-between;width:100%;margin-bottom:6px}
.data-card{background:#171a26;border:1px solid #2a2f45;border-radius:8px;padding:4px 8px;width:48%}
.title{font-size:9px;color:#6c7a9c}
.val{font-size:15px;font-weight:bold;color:#00ffcc}

.spin-btn{
    width: 75px;
    height: 75px;
    border-radius: 50%;
    font-size: 14px;
    font-weight: 900;
    border: 3px solid #ffdf40;
    background: linear-gradient(135deg, #fff275, #f5af19, #c75c00);
    color: #000;
    box-shadow: 0 0 12px rgba(245, 175, 25, 0.6);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.1s;
}
.spin-btn:active{transform:scale(0.9);}
.spin-btn:disabled{background:#444;color:#777;border-color:#666;box-shadow:none;cursor:not-allowed;}

@keyframes rotateBtn {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.spin-btn.spinning {
    animation: rotateBtn 0.6s linear infinite;
}
</style>
</head>
<body>
<div class="top-banner">
<div class="logo">SUPER ACE</div>
<div class="mult-bar">
<div id="m1" class="mult-btn active">x1</div>
<div id="m2" class="mult-btn">x2</div>
<div id="m3" class="mult-btn">x3</div>
<div id="m5" class="mult-btn">x5</div>
</div>
</div>
<div class="game-frame">
<div class="grid" id="grid"></div>
</div>
<div class="status" id="status">CHỌN MỨC CƯỢC VÀ QUAY</div>
<div class="bottom-panel">
    <div class="bet-container">
        <span class="bet-label">CHỌN MỨC CƯỢC:</span>
        <div class="bet-bar" id="betBar"></div>
    </div>

<div class="data-row">
<div class="data-card"><div class="title">SỐ DƯ</div><div class="val" id="balance">10,000</div></div>
<div class="data-card"><div class="title">THẮNG</div><div class="val" id="win" style="color:#ffe066">0</div></div>
</div>
<button class="spin-btn" id="spinBtn" onclick="spin()">QUAY</button>
</div>

<script>
const BET_LEVELS = [0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500];
let currentBet = 5; // Mức cược mặc định ban đầu

const ITEMS=[
{rank:'A',suit:'♠',name:'ÁT BÍCH',color:'#000'},
{rank:'A',suit:'♥',name:'ÁT CƠ',color:'#d32f2f'},
{rank:'A',suit:'♦',name:'ÁT RÔ',color:'#d32f2f'},
{rank:'A',suit:'♣',name:'ÁT NHÉP',color:'#000'},
{rank:'K',suit:'♠',name:'GIÀ BÍCH',color:'#000'},
{rank:'K',suit:'♥',name:'GIÀ CƠ',color:'#d32f2f'},
{rank:'K',suit:'♦',name:'GIÀ RÔ',color:'#d32f2f'},
{rank:'K',suit:'♣',name:'GIÀ NHÉP',color:'#000'},
{rank:'Q',suit:'♠',name:'ĐẦM BÍCH',color:'#000'},
{rank:'Q',suit:'♥',name:'ĐẦM CƠ',color:'#d32f2f'},
{rank:'Q',suit:'♦',name:'ĐẦM RÔ',color:'#d32f2f'},
{rank:'Q',suit:'♣',name:'ĐẦM NHÉP',color:'#000'},
{rank:'J',suit:'♠',name:'BỒI BÍCH',color:'#000'},
{rank:'J',suit:'♥',name:'BỒI CƠ',color:'#d32f2f'},
{rank:'J',suit:'♦',name:'BỒI RÔ',color:'#d32f2f'},
{rank:'J',suit:'♣',name:'BỒI NHÉP',color:'#000'},
{rank:'10',suit:'♥',name:'10 CƠ',color:'#d32f2f'},
{rank:'10',suit:'♦',name:'10 RÔ',color:'#d32f2f'},
{rank:'🌟',suit:'',name:'WILD',color:'#ff9100',isWild:true}
];

let balance=10000,isSpinning=false,grid=document.getElementById('grid');

function initBets(){
    let bar = document.getElementById('betBar');
    bar.innerHTML = '';
    BET_LEVELS.forEach(bet => {
        let btn = document.createElement('button');
        btn.className = 'bet-btn' + (bet === currentBet ? ' active' : '');
        btn.innerText = bet;
        btn.onclick = () => {
            if(isSpinning) return;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentBet = bet;
        };
        bar.appendChild(btn);
    });
}

function init(){
    initBets();
    grid.innerHTML='';
    for(let i=0;i<16;i++)grid.appendChild(createCard(ITEMS[Math.floor(Math.random()*ITEMS.length)], i));
}

function createCard(item, index){
let d=document.createElement('div');
d.className='card' + (item.isWild ? ' wild' : '');
d.style.animationDelay = (index * 0.02) + 's';

if(item.isWild){
d.innerHTML=`
<div class="card-top" style="color:${item.color}">${item.rank}</div>
<div class="card-center">${item.rank}</div>
<div class="card-sub">${item.name}</div>
`;
} else {
d.innerHTML=`
<div class="card-top" style="color:${item.color}">${item.rank}<br>${item.suit}</div>
<div class="card-center" style="color:${item.color}">${item.suit}</div>
<div class="card-sub">${item.name}</div>
`;
}
return d;
}

function spin(){
if(isSpinning||balance < currentBet) {
    if(balance < currentBet) alert("Số dư không đủ để đặt cược mức này!");
    return;
}

balance -= currentBet;
document.getElementById('balance').innerText = balance.toLocaleString(undefined, {maximumFractionDigits: 1});
document.getElementById('win').innerText='0';
document.getElementById('status').innerText='ĐANG QUAY...';
let btn = document.getElementById('spinBtn');
btn.disabled=true;
btn.classList.add('spinning');
isSpinning=true;

let c=0,t=setInterval(()=>{
grid.innerHTML='';
for(let i=0;i<16;i++)grid.appendChild(createCard(ITEMS[Math.floor(Math.random()*ITEMS.length)], i));
c++;
if(c>15){clearInterval(t);finish();}
},60);
}

function finish(){
isSpinning=false;
let btn = document.getElementById('spinBtn');
btn.disabled=false;
btn.classList.remove('spinning');

if(Math.random()>0.5){
let multFactor = Math.floor(Math.random() * 5 + 1) * 20;
let w = currentBet * multFactor;
balance += w;
document.getElementById('balance').innerText = balance.toLocaleString(undefined, {maximumFractionDigits: 1});
document.getElementById('win').innerText = w.toLocaleString(undefined, {maximumFractionDigits: 1});
document.getElementById('status').innerText = `🎉 BIG WIN +${w.toLocaleString()}!`;
document.querySelectorAll('.mult-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('m3').classList.add('active');
}else{
document.getElementById('status').innerText='CHÚC MAY MẮN LẦN SAU!';
document.querySelectorAll('.mult-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('m1').classList.add('active');
}
}

init();
</script>
</body>
</html>
